name: Deploy Sanity Studio

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SANITY_STUDIO_PREVIEW_URL: ${{ vars.SANITY_STUDIO_PREVIEW_URL }}
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
  SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
  SANITY_STUDIO_HOSTNAME: ${{ vars.SANITY_STUDIO_HOSTNAME }}
  SANITY_STUDIO_API_VERSION: ${{ vars.SANITY_STUDIO_API_VERSION }}
  SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

concurrency:
  group: deploy-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-studio:
    name: Build & Validate Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required environment variables
        run: |
          if [ -z "${SANITY_STUDIO_PREVIEW_URL}" ]; then exit 1; fi
          if [ -z "${SANITY_STUDIO_PROJECT_ID}" ]; then exit 1; fi
          if [ -z "${SANITY_STUDIO_HOSTNAME}" ]; then exit 1; fi
          if [ -z "${SANITY_AUTH_TOKEN}" ]; then exit 1; fi
          echo "✅ All required variables and secrets are configured"

      - name: Build Sanity Studio
        working-directory: ./studio
        run: pnpm run build

  deploy-studio:
    name: Deploy Studio
    runs-on: ubuntu-latest
    needs: [build-studio]
    # Hanya deploy jika build sukses dan merupakan event PUSH langsung.
    if: github.event_name == 'push' && needs.build-studio.result == 'success'
    environment: ${{ github.ref_name == 'develop' && 'development' || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Sanity
        working-directory: ./studio
        run: |
          echo "🚀 Starting Sanity Studio deployment..."
          # Kita hilangkan --no-build karena ini adalah job terpisah (harus build ulang di runner ini, atau upload artifact)
          # Menggunakan --no-build di job berbeda akan gagal karena folder /dist tidak ada di runner ini.
          pnpm exec sanity deploy --yes --url "${SANITY_STUDIO_HOSTNAME}.sanity.studio"
          echo "✅ Sanity Studio deployed successfully!"